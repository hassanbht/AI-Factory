name: CI

# Runs on every PR (any branch) and on every push to main. This is the fast, single-pass
# validation gate — one build, one full test run, one docker compose smoke test. The
# repeated-3x stability gate and release certification (SBOM, container scan, migration
# failure gate, backup/restore gate) live in release.yml instead, gated on version tags.
on:
  pull_request:
  push:
    branches: [main, master]

# Least privilege: default to read-only for repository contents across all jobs
permissions:
  contents: read

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore apps/AI.Factory.slnx

      - name: Build (Release)
        run: dotnet build apps/AI.Factory.slnx --configuration Release --no-restore

      - name: Test (full run)
        run: dotnet test apps/AI.Factory.slnx --configuration Release --no-build --blame-hang-timeout 90s --logger "trx;LogFileName=test-results.trx"

      - name: Test — Category=Resilience
        run: dotnet test apps/AI.Factory.slnx --configuration Release --no-build --blame-hang-timeout 90s --filter "Category=Resilience" --logger "trx;LogFileName=test-results-resilience.trx"

      - name: Test — Category=Stress
        run: dotnet test apps/AI.Factory.slnx --configuration Release --no-build --blame-hang-timeout 90s --filter "Category=Stress" --logger "trx;LogFileName=test-results-stress.trx"

      - name: Test — Category=Load
        run: dotnet test apps/AI.Factory.slnx --configuration Release --no-build --blame-hang-timeout 90s --filter "Category=Load" --logger "trx;LogFileName=test-results-load.trx"

      - name: Test — Category=ContainerIntegration
        run: dotnet test apps/AI.Factory.slnx --configuration Release --no-build --blame-hang-timeout 90s --filter "Category=ContainerIntegration" --logger "trx;LogFileName=test-results-container-integration.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trx-test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: warn

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore apps/AI.Factory.slnx

      # KNOWN LIMITATION: `dotnet list package --vulnerable` output is text, not structured
      # JSON/SARIF, so we cannot reliably bucket findings by exact severity here. Any
      # vulnerability at any severity fails this job — see phase-17.5.1 doc, "Known
      # Limitations", for the tracked follow-up (e.g. parsing --format json once the CLI
      # supports it, or switching to a SARIF-producing scanner).
      - name: Scan for vulnerable NuGet packages (any severity blocks)
        run: |
          set -o pipefail
          dotnet list apps/AI.Factory.slnx package --vulnerable --include-transitive | tee vulnerable-packages.txt
          if grep -q "has the following vulnerable packages" vulnerable-packages.txt; then
            echo "::error::Vulnerable NuGet package(s) detected — see output above."
            exit 1
          fi

      - name: Upload dependency scan output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dependency-scan-output
          path: vulnerable-packages.txt

  docker-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate compose file
        run: docker compose config -q

      - name: Build images
        run: docker compose build

  container-smoke-test:
    needs: docker-validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Phase 18.29.1 — the worker service joins the Docker socket's owning group so
      # its non-root user can reach the daemon (see docker-compose.yml). That gid is
      # host-specific: 0 on Docker Desktop, the `docker` group on a GitHub runner, so
      # it is resolved here rather than hard-coded.
      - name: Resolve Docker socket group id
        run: echo "DOCKER_SOCKET_GID=$(stat -c '%g' /var/run/docker.sock)" >> "$GITHUB_ENV"

      - name: Start stack
        run: docker compose up -d

      - name: Wait for migrator to complete successfully
        run: |
          set -e
          timeout=120
          elapsed=0
          while [ "$(docker inspect -f '{{.State.Status}}' $(docker compose ps -a -q migrator))" != "exited" ]; do
            if [ "$elapsed" -ge "$timeout" ]; then
              echo "::error::Timed out waiting for migrator to exit."
              docker compose logs migrator
              exit 1
            fi
            sleep 3
            elapsed=$((elapsed + 3))
          done
          exit_code=$(docker inspect -f '{{.State.ExitCode}}' $(docker compose ps -a -q migrator))
          echo "migrator exit code: $exit_code"
          if [ "$exit_code" != "0" ]; then
            docker compose logs migrator
            exit 1
          fi

      - name: Wait for api and worker to report healthy
        run: |
          set -e
          for service in api worker; do
            timeout=120
            elapsed=0
            cid=$(docker compose ps -q "$service")
            while [ "$(docker inspect --format='{{.State.Health.Status}}' "$cid")" != "healthy" ]; do
              if [ "$elapsed" -ge "$timeout" ]; then
                echo "::error::Timed out waiting for $service to become healthy."
                docker compose logs "$service"
                exit 1
              fi
              sleep 3
              elapsed=$((elapsed + 3))
            done
          done

      - name: Probe health endpoints
        run: |
          set -e
          curl -f http://localhost:8080/health/live
          curl -f http://localhost:8080/health/ready

      - name: Confirm worker liveness file
        run: docker compose exec -T worker test -f /tmp/ai-factory-health/worker.live

      - name: Deployment diagnostics must not leak secrets
        run: |
          set -e
          body=$(curl -f http://localhost:8080/api/operations/deployment)
          echo "$body"
          if echo "$body" | grep -iE 'password|secret|apikey|Data Source=' >/dev/null; then
            echo "::error::Deployment diagnostics response appears to leak sensitive data."
            exit 1
          fi

      - name: Tear down
        if: always()
        run: docker compose down -v

  # --- Flutter client (Phase 19.10) --------------------------------------------------------
  # Every quality gate of apps/ai_factory_client, credential-free. Windows, because the
  # goldens are rendered by the Windows test engine and Windows desktop is the primary
  # release target. Flutter is cloned at a pinned tag rather than installed by a
  # third-party action, so no unpinned action code runs here.
  flutter-client:
    runs-on: windows-latest
    env:
      FLUTTER_VERSION: '3.47.5'
    defaults:
      run:
        shell: bash
        working-directory: apps/ai_factory_client
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Flutter (pinned)
        working-directory: ${{ runner.temp }}
        run: |
          git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git flutter
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Flutter version
        run: flutter --version

      - name: Dependencies
        run: flutter pub get

      - name: Format
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Secret scan — sources, tests, fixtures, assets (values, not references)
        run: dart run tool/secret_scan.dart

      - name: Translation coverage
        run: flutter test test/localization

      - name: Fixture validation (committed contract fixtures)
        run: flutter test test/contract

      - name: Unit, widget, accessibility, performance, soak and regression tests
        run: flutter test --exclude-tags golden

      - name: Golden tests (EN/DE × compact/medium/expanded × light/dark)
        run: flutter test --tags golden

      - name: Upload golden failures
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: golden-failures
          path: apps/ai_factory_client/test/golden/failures/
          if-no-files-found: ignore

      # A release build carries no API address unless one is given at build time
      # (AppConfig.resolve), and never an operational key.
      - name: Windows release build
        run: flutter build windows --release

      - name: Web release build
        run: flutter build web --release

      - name: Secret scan — release build output
        run: dart run tool/secret_scan.dart build/web build/windows/x64/runner/Release

  # Contract drift: a fresh API on a throwaway SQLite file, captured and compared with the
  # committed fixtures. Credential-free: the API runs with its default RequireAccessKey=false
  # and no provider is called. Fails on any contract drift (see tool/api_fixtures.dart).
  flutter-contract-fixtures:
    runs-on: ubuntu-latest
    env:
      FLUTTER_VERSION: '3.47.5'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install Flutter (pinned)
        run: |
          git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Build the API
        run: dotnet build apps/src/AI.Factory.Api/AI.Factory.Api.csproj --configuration Release

      - name: Start the API on a throwaway database
        run: |
          set -e
          db="$RUNNER_TEMP/contract-fixtures.db"
          test ! -e "$db"
          ASPNETCORE_ENVIRONMENT=Development \
          ASPNETCORE_URLS=http://127.0.0.1:5299 \
          Database__ConnectionString="Data Source=$db" \
          ConnectionStrings__FactoryDatabase="Data Source=$db" \
          Database__AutoMigrate=true \
          nohup dotnet apps/src/AI.Factory.Api/bin/Release/net10.0/AI.Factory.Api.dll \
            > "$RUNNER_TEMP/api.log" 2>&1 &
          echo "API_PID=$!" >> "$GITHUB_ENV"
          for i in $(seq 1 60); do
            if curl -fs http://127.0.0.1:5299/health/ready > /dev/null; then echo "ready after ${i}s"; break; fi
            sleep 1
          done
          curl -fs http://127.0.0.1:5299/health/ready
          grep -q "SqliteDataDirectoryReady" "$RUNNER_TEMP/api.log"

      - name: Dependencies
        working-directory: apps/ai_factory_client
        run: flutter pub get

      - name: Capture and compare (fails on drift)
        working-directory: apps/ai_factory_client
        run: dart run tool/api_fixtures.dart --base-url http://127.0.0.1:5299 --check

      - name: Stop the API
        if: always()
        run: |
          if [ -n "${API_PID:-}" ]; then kill "$API_PID" || true; fi

      - name: Upload API log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: contract-api-log
          path: ${{ runner.temp }}/api.log
          if-no-files-found: ignore
