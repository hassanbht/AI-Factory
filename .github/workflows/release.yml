name: Release

# Release certification pipeline: triggered by a semver tag push or manual dispatch.
# Runs a repeated stability gate, versioned builds, immutable image tags (no registry push —
# see Known Limitations in the phase-17.5.1 doc), SBOM generation, container vulnerability
# scanning, and two regression gates (migration-failure blocking, backup/restore) before a
# final GO/NO-GO summary.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

env:
  DOTNET_VERSION: '10.0.x'

# Least-privilege default: every job only needs to read the checked-out source. The single
# exception (packages: write, needed to push images to GHCR) is granted only on the
# docker-release job below, not repo-wide — see that job's own `permissions:` block.
permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      semantic_version: ${{ steps.vars.outputs.semantic_version }}
      git_commit: ${{ steps.vars.outputs.git_commit }}
      git_branch: ${{ steps.vars.outputs.git_branch }}
      build_number: ${{ steps.vars.outputs.build_number }}
      artifact_suffix: ${{ steps.vars.outputs.artifact_suffix }}
      repo_lower: ${{ steps.vars.outputs.repo_lower }}
    steps:
      # fetch-depth: 0 (full history, all tags) is required by the tag-validation steps below —
      # `git rev-list`/`git merge-base --is-ancestor` need real history, not a shallow clone.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      # --- Tag/version validation (phase 17.5.2, Workstream H §11.1) ---------------------------
      # This DOES run correctly today, locally, on any `push: tags` trigger — unlike the
      # registry-publish steps further down, it needs no remote/registry. Fails the whole
      # workflow immediately, before any build/test/publish work, if the pushed tag doesn't
      # match VERSION. Skipped for workflow_dispatch (no tag to validate against).
      - name: Validate tag matches VERSION
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        run: |
          set -e
          version_file=$(cat VERSION | tr -d '[:space:]')
          tag_name="${{ github.ref_name }}"
          # Normalization rule: strip a single leading "v" only (v0.1.0 -> 0.1.0). Nothing else
          # is stripped — a pre-release suffix (v0.1.0-rc1 -> 0.1.0-rc1) is preserved as-is, so
          # it only matches a VERSION file carrying the identical suffix. Same rule is unit-tested
          # in apps/tests/AI.Factory.Application.Tests/Versioning/ReleaseTagValidatorTests.cs via
          # AI.Factory.Application.Versioning.ReleaseTagValidator — keep both in sync.
          normalized_tag="${tag_name#v}"
          echo "VERSION file: $version_file"
          echo "Tag (normalized): $normalized_tag"
          if [ "$normalized_tag" != "$version_file" ]; then
            echo "::error::Tag '$tag_name' (normalized: '$normalized_tag') does not match VERSION file ('$version_file'). Release blocked before any build/publish work."
            exit 1
          fi

      # --- Duplicate-release / force-moved-tag protection (Workstream H §11.3, local form) ------
      # Full duplicate-release protection checks whether the *registry* already has this version
      # published — this repo has no registry configured yet (no remote), so that check cannot
      # be exercised this session; deferred until GHCR publishing is live (see phase-17.5.2 doc,
      # Known limitations). What CAN be checked locally: if this tag name already existed before
      # this push, it must still point at the commit currently being built — i.e. it wasn't
      # force-moved/reused to reference a different commit.
      - name: Reject a force-moved/reused tag
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        run: |
          set -e
          tag_name="${{ github.ref_name }}"
          tag_sha=$(git rev-list -1 "$tag_name")
          if [ "$tag_sha" != "${{ github.sha }}" ]; then
            echo "::error::Tag '$tag_name' points at commit $tag_sha, but this workflow run is building ${{ github.sha }}. The tag appears to have been force-moved/reused. Refusing to release."
            exit 1
          fi

      # --- Branch/ancestry policy (Workstream H §11.2) -----------------------------------------
      # Assumption, documented because there is no real remote to test this against yet: this
      # repo currently has no configured "origin" (verified via `git remote -v` — empty). Written
      # defensively to try origin/main first (the real check once a remote exists) and fall back
      # to a local "main" branch ref so this step still runs meaningfully today. Re-verify against
      # a real origin the first time this repo is actually pushed to GitHub.
      - name: Verify release tag is reachable from main
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        run: |
          set -e
          if git show-ref --verify --quiet refs/remotes/origin/main; then
            main_ref="origin/main"
          elif git show-ref --verify --quiet refs/heads/main; then
            main_ref="main"
          else
            echo "::error::No 'origin/main' or local 'main' ref found — cannot verify branch ancestry."
            exit 1
          fi
          if ! git merge-base --is-ancestor "${{ github.sha }}" "$main_ref"; then
            echo "::error::Release tag commit ${{ github.sha }} is not an ancestor of $main_ref. Release blocked."
            exit 1
          fi

      - id: vars
        run: |
          semantic_version=$(cat VERSION | tr -d '[:space:]')
          git_commit=$(git rev-parse --short HEAD)
          repo_lower=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "semantic_version=$semantic_version" >> "$GITHUB_OUTPUT"
          echo "git_commit=$git_commit" >> "$GITHUB_OUTPUT"
          echo "git_branch=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          echo "build_number=${{ github.run_id }}" >> "$GITHUB_OUTPUT"
          echo "artifact_suffix=$semantic_version-$git_commit" >> "$GITHUB_OUTPUT"
          echo "repo_lower=$repo_lower" >> "$GITHUB_OUTPUT"

  stability-gate:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore apps/AI.Factory.slnx

      - name: Build (Release)
        run: dotnet build apps/AI.Factory.slnx --configuration Release --no-restore

      - name: Run full test suite 3x sequentially (stability gate)
        run: |
          set -e
          for i in 1 2 3; do
            echo "=== Stability run $i/3 ==="
            dotnet test apps/AI.Factory.slnx --configuration Release --no-build --blame-hang-timeout 90s
          done

      - name: Test — Category=Resilience
        run: dotnet test apps/AI.Factory.slnx --configuration Release --no-build --blame-hang-timeout 90s --filter "Category=Resilience"

      - name: Test — Category=Stress
        run: dotnet test apps/AI.Factory.slnx --configuration Release --no-build --blame-hang-timeout 90s --filter "Category=Stress"

      - name: Test — Category=Load
        run: dotnet test apps/AI.Factory.slnx --configuration Release --no-build --blame-hang-timeout 90s --filter "Category=Load"

      - name: Test — Category=ContainerIntegration
        run: dotnet test apps/AI.Factory.slnx --configuration Release --no-build --blame-hang-timeout 90s --filter "Category=ContainerIntegration"

  versioned-build:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore apps/AI.Factory.slnx

      # Property names (GitCommit/GitBranch/BuildNumber) match apps/Directory.Build.props exactly.
      - name: Build with version metadata
        run: |
          dotnet build apps/AI.Factory.slnx --configuration Release \
            -p:GitCommit=${{ needs.setup.outputs.git_commit }} \
            -p:GitBranch=${{ needs.setup.outputs.git_branch }} \
            -p:BuildNumber=${{ needs.setup.outputs.build_number }}

  docker-release:
    needs: [setup, stability-gate, versioned-build]
    runs-on: ubuntu-latest
    # packages: write is scoped to this job ONLY (least privilege) — it is the sole job that
    # authenticates to GHCR and pushes images. Every other job in this workflow either only reads
    # checked-out source (contents: read, inherited from the workflow-level default above) or
    # downloads/loads the .tar artifacts this job uploads; none of them need registry write.
    permissions:
      contents: read
      packages: write
    outputs:
      api_digest: ${{ steps.digest.outputs.api_digest }}
      worker_digest: ${{ steps.digest.outputs.worker_digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Dormant until this repo has a remote: this login only succeeds once the repository
      # actually exists on GitHub. github.actor / secrets.GITHUB_TOKEN are the built-in
      # identity/token GitHub Actions provides automatically — no new secret needs to be created
      # by the user for GHCR specifically.
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image references and tags
        id: img
        run: |
          echo "api_image=ghcr.io/${{ needs.setup.outputs.repo_lower }}/api" >> "$GITHUB_OUTPUT"
          echo "worker_image=ghcr.io/${{ needs.setup.outputs.repo_lower }}/worker" >> "$GITHUB_OUTPUT"
          echo "sha_tag=sha-${{ needs.setup.outputs.git_commit }}" >> "$GITHUB_OUTPUT"
          echo "build_tag=build-${{ needs.setup.outputs.build_number }}" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # Build-arg names (BUILD_VERSION/GIT_COMMIT/GIT_BRANCH/BUILD_NUMBER/IMAGE_SOURCE_URL) match
      # the ARGs declared in Dockerfile.api / Dockerfile.worker exactly, and the --label flags
      # match the LABELs baked into those Dockerfiles' final stage, so the two stay in lockstep —
      # both derive from the same needs.setup outputs, so there is no independent version source.
      #
      # Required tags per phase 17.5.2 §5.3: immutable semver, commit-traceability (sha-<short>),
      # and an optional build tag (build-<run id>). `latest` is also pushed, but only as an
      # optional convenience tag — it is NEVER the sole production reference; deployments must
      # pin to one of the three immutable tags (see docker-compose.release.yml).
      #
      # This repo has no registry/credentials configured yet (no git remote — see Known
      # Limitations in the phase-17.5.2 doc), so the build below only ever runs inside a GitHub
      # Actions run once this repo is pushed; today it is dormant, unexecuted workflow YAML.
      - name: Build API image
        run: |
          docker build -f Dockerfile.api \
            --build-arg BUILD_VERSION=${{ needs.setup.outputs.semantic_version }} \
            --build-arg GIT_COMMIT=${{ needs.setup.outputs.git_commit }} \
            --build-arg GIT_BRANCH=${{ needs.setup.outputs.git_branch }} \
            --build-arg BUILD_NUMBER=${{ needs.setup.outputs.build_number }} \
            --build-arg IMAGE_SOURCE_URL=https://github.com/${{ github.repository }} \
            --label org.opencontainers.image.version=${{ needs.setup.outputs.semantic_version }} \
            --label org.opencontainers.image.revision=${{ needs.setup.outputs.git_commit }} \
            --label org.opencontainers.image.created=${{ steps.img.outputs.created }} \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            -t ${{ steps.img.outputs.api_image }}:${{ needs.setup.outputs.semantic_version }} \
            -t ${{ steps.img.outputs.api_image }}:${{ steps.img.outputs.sha_tag }} \
            -t ${{ steps.img.outputs.api_image }}:${{ steps.img.outputs.build_tag }} \
            -t ${{ steps.img.outputs.api_image }}:latest \
            -t ai-factory-api:${{ needs.setup.outputs.semantic_version }} \
            -t ai-factory-api:${{ needs.setup.outputs.git_commit }} \
            .

      - name: Build Worker image
        run: |
          docker build -f Dockerfile.worker \
            --build-arg BUILD_VERSION=${{ needs.setup.outputs.semantic_version }} \
            --build-arg GIT_COMMIT=${{ needs.setup.outputs.git_commit }} \
            --build-arg GIT_BRANCH=${{ needs.setup.outputs.git_branch }} \
            --build-arg BUILD_NUMBER=${{ needs.setup.outputs.build_number }} \
            --build-arg IMAGE_SOURCE_URL=https://github.com/${{ github.repository }} \
            --label org.opencontainers.image.version=${{ needs.setup.outputs.semantic_version }} \
            --label org.opencontainers.image.revision=${{ needs.setup.outputs.git_commit }} \
            --label org.opencontainers.image.created=${{ steps.img.outputs.created }} \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            -t ${{ steps.img.outputs.worker_image }}:${{ needs.setup.outputs.semantic_version }} \
            -t ${{ steps.img.outputs.worker_image }}:${{ steps.img.outputs.sha_tag }} \
            -t ${{ steps.img.outputs.worker_image }}:${{ steps.img.outputs.build_tag }} \
            -t ${{ steps.img.outputs.worker_image }}:latest \
            -t ai-factory-worker:${{ needs.setup.outputs.semantic_version }} \
            -t ai-factory-worker:${{ needs.setup.outputs.git_commit }} \
            .

      # Local-only tags (ai-factory-api/worker:<semver>), saved for the sbom/container-scan/
      # migration-failure-gate/backup-restore-gate jobs, which only need a locally loadable image
      # and must not depend on a registry round-trip.
      - name: Save images for downstream jobs
        run: |
          docker save ai-factory-api:${{ needs.setup.outputs.semantic_version }} -o /tmp/ai-factory-api.tar
          docker save ai-factory-worker:${{ needs.setup.outputs.semantic_version }} -o /tmp/ai-factory-worker.tar

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: docker-images-${{ needs.setup.outputs.artifact_suffix }}
          path: /tmp/ai-factory-*.tar
          retention-days: 7

      # Registry push — pushes all tags to GHCR
      - name: Push API image (all tags)
        run: |
          docker push ${{ steps.img.outputs.api_image }}:${{ needs.setup.outputs.semantic_version }}
          docker push ${{ steps.img.outputs.api_image }}:${{ steps.img.outputs.sha_tag }}
          docker push ${{ steps.img.outputs.api_image }}:${{ steps.img.outputs.build_tag }}
          docker push ${{ steps.img.outputs.api_image }}:latest

      - name: Push Worker image (all tags)
        run: |
          docker push ${{ steps.img.outputs.worker_image }}:${{ needs.setup.outputs.semantic_version }}
          docker push ${{ steps.img.outputs.worker_image }}:${{ steps.img.outputs.sha_tag }}
          docker push ${{ steps.img.outputs.worker_image }}:${{ steps.img.outputs.build_tag }}
          docker push ${{ steps.img.outputs.worker_image }}:latest

      # Digest capture (phase 17.5.2 §6.1 / phase 17.5.3 §8):
      - name: Capture published digests
        id: digest
        run: |
          api_digest=$(docker inspect --format='{{index .RepoDigests 0}}' ${{ steps.img.outputs.api_image }}:${{ needs.setup.outputs.semantic_version }})
          worker_digest=$(docker inspect --format='{{index .RepoDigests 0}}' ${{ steps.img.outputs.worker_image }}:${{ needs.setup.outputs.semantic_version }})
          echo "api_digest=$api_digest" >> "$GITHUB_OUTPUT"
          echo "worker_digest=$worker_digest" >> "$GITHUB_OUTPUT"
          {
            echo "## Published image digests"
            echo ""
            echo "| Image | Digest |"
            echo "|---|---|"
            echo "| API | \`$api_digest\` |"
            echo "| Worker | \`$worker_digest\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  sbom:
    needs: [setup, docker-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: docker-images-${{ needs.setup.outputs.artifact_suffix }}
          path: /tmp

      - name: Load images
        run: |
          docker load -i /tmp/ai-factory-api.tar
          docker load -i /tmp/ai-factory-worker.tar

      - name: Generate SBOM — API image
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ai-factory-api:${{ needs.setup.outputs.semantic_version }}
          format: cyclonedx-json
          output-file: sbom-api-${{ needs.setup.outputs.semantic_version }}.cyclonedx.json

      - name: Generate SBOM — Worker image
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ai-factory-worker:${{ needs.setup.outputs.semantic_version }}
          format: cyclonedx-json
          output-file: sbom-worker-${{ needs.setup.outputs.semantic_version }}.cyclonedx.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom-${{ needs.setup.outputs.artifact_suffix }}
          path: '*.cyclonedx.json'

  container-scan:
    needs: [setup, docker-release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull published images for local scanning
        run: |
          docker pull ghcr.io/${{ needs.setup.outputs.repo_lower }}/api:${{ needs.setup.outputs.semantic_version }}
          docker pull ghcr.io/${{ needs.setup.outputs.repo_lower }}/worker:${{ needs.setup.outputs.semantic_version }}

      - name: Scan API image (published registry artifact)
        uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297 # master
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ghcr.io/${{ needs.setup.outputs.repo_lower }}/api:${{ needs.setup.outputs.semantic_version }}
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          format: 'table'
          output: 'trivy-api.txt'

      - name: Scan Worker image (published registry artifact)
        if: always()
        uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297 # master
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ghcr.io/${{ needs.setup.outputs.repo_lower }}/worker:${{ needs.setup.outputs.semantic_version }}
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          format: 'table'
          output: 'trivy-worker.txt'

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: trivy-scan-${{ needs.setup.outputs.artifact_suffix }}
          path: trivy-*.txt

  migration-failure-gate:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Run migrator with simulated failure and assert non-zero exit
        run: |
          set +e
          docker compose -f docker-compose.yml -f docker-compose.test-migration-failure.yml up migrator
          exit_code=$(docker inspect -f '{{.State.ExitCode}}' $(docker compose -f docker-compose.yml -f docker-compose.test-migration-failure.yml ps -a -q migrator))
          echo "migrator exit code: $exit_code"
          if [ "$exit_code" = "0" ]; then
            echo "::error::Expected migrator to fail (simulated failure) but it exited 0."
            exit 1
          fi

      - name: Assert api/worker never started
        run: |
          set -e
          for service in api worker; do
            cid=$(docker compose -f docker-compose.yml -f docker-compose.test-migration-failure.yml ps -q "$service")
            if [ -n "$cid" ]; then
              status=$(docker inspect -f '{{.State.Status}}' "$cid")
              if [ "$status" = "running" ]; then
                echo "::error::$service must not start after a failed migration, but it is running."
                exit 1
              fi
            fi
          done

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.test-migration-failure.yml down -v

  published-smoke-test:
    needs: [setup, docker-release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      AI_FACTORY_API_IMAGE: ${{ needs.docker-release.outputs.api_digest }}
      AI_FACTORY_WORKER_IMAGE: ${{ needs.docker-release.outputs.worker_digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull published release images by immutable digest
        env:
          AI_FACTORY_API_IMAGE: ${{ needs.docker-release.outputs.api_digest }}
          AI_FACTORY_WORKER_IMAGE: ${{ needs.docker-release.outputs.worker_digest }}
        run: |
          echo "Pulling published API: $AI_FACTORY_API_IMAGE"
          echo "Pulling published Worker: $AI_FACTORY_WORKER_IMAGE"
          docker compose -f docker-compose.yml -f docker-compose.release.yml pull

      - name: Start stack from published images (--no-build)
        env:
          AI_FACTORY_API_IMAGE: ${{ needs.docker-release.outputs.api_digest }}
          AI_FACTORY_WORKER_IMAGE: ${{ needs.docker-release.outputs.worker_digest }}
        run: |
          docker compose -f docker-compose.yml -f docker-compose.release.yml up -d --no-build

      - name: Wait for migrator to complete successfully
        run: |
          set -e
          timeout=120
          elapsed=0
          while [ "$(docker inspect -f '{{.State.Status}}' $(docker compose -f docker-compose.yml -f docker-compose.release.yml ps -a -q migrator))" != "exited" ]; do
            if [ "$elapsed" -ge "$timeout" ]; then
              echo "::error::Timed out waiting for migrator to exit."
              docker compose -f docker-compose.yml -f docker-compose.release.yml logs migrator
              exit 1
            fi
            sleep 3
            elapsed=$((elapsed + 3))
          done
          exit_code=$(docker inspect -f '{{.State.ExitCode}}' $(docker compose -f docker-compose.yml -f docker-compose.release.yml ps -a -q migrator))
          echo "migrator exit code: $exit_code"
          if [ "$exit_code" != "0" ]; then
            docker compose -f docker-compose.yml -f docker-compose.release.yml logs migrator
            exit 1
          fi

      - name: Wait for api and worker to report healthy
        run: |
          set -e
          for service in api worker; do
            timeout=120
            elapsed=0
            cid=$(docker compose -f docker-compose.yml -f docker-compose.release.yml ps -q "$service")
            while [ "$(docker inspect --format='{{.State.Health.Status}}' "$cid")" != "healthy" ]; do
              if [ "$elapsed" -ge "$timeout" ]; then
                echo "::error::Timed out waiting for $service to become healthy."
                docker compose -f docker-compose.yml -f docker-compose.release.yml logs "$service"
                exit 1
              fi
              sleep 3
              elapsed=$((elapsed + 3))
            done
          done

      - name: Validate health endpoints
        run: |
          set -e
          curl -f http://localhost:8080/health/live
          curl -f http://localhost:8080/health/ready

      - name: Confirm worker liveness probe file
        run: docker compose -f docker-compose.yml -f docker-compose.release.yml exec -T worker test -f /tmp/ai-factory-health/worker.live

      - name: Validate deployment diagnostics metadata and security
        run: |
          set -e
          body=$(curl -f http://localhost:8080/api/operations/deployment)
          echo "Diagnostics response: $body"
          if echo "$body" | grep -iE 'password|secret|apikey|Data Source=' >/dev/null; then
            echo "::error::Deployment diagnostics response appears to leak sensitive data."
            exit 1
          fi
          expected_version="${{ needs.setup.outputs.semantic_version }}"
          if ! echo "$body" | grep -q "$expected_version"; then
            echo "::error::Deployment diagnostics did not contain expected version $expected_version"
            exit 1
          fi

      - name: Run backup (--backup-database)
        run: docker compose -f docker-compose.yml -f docker-compose.release.yml exec -T api dotnet AI.Factory.Api.dll --backup-database

      - name: Restore latest backup (--restore-database <path>)
        run: |
          set -e
          backup_file=$(docker compose -f docker-compose.yml -f docker-compose.release.yml exec -T api sh -c "ls -t /var/lib/ai-factory/backups | head -n1" | tr -d '\r')
          echo "Restoring from $backup_file"
          docker compose -f docker-compose.yml -f docker-compose.release.yml exec -T api dotnet AI.Factory.Api.dll --restore-database "/var/lib/ai-factory/backups/$backup_file"

      - name: Assert api and worker remain healthy after restore
        run: |
          set -e
          for service in api worker; do
            cid=$(docker compose -f docker-compose.yml -f docker-compose.release.yml ps -q "$service")
            status=$(docker inspect --format='{{.State.Health.Status}}' "$cid")
            if [ "$status" != "healthy" ]; then
              echo "::error::$service is not healthy after restore (status: $status)."
              docker compose -f docker-compose.yml -f docker-compose.release.yml logs "$service"
              exit 1
            fi
          done

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.release.yml down -v

  release-gate:
    needs: [stability-gate, versioned-build, docker-release, sbom, container-scan, migration-failure-gate, published-smoke-test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate GO/NO-GO
        run: |
          declare -A results=(
            [stability-gate]="${{ needs.stability-gate.result }}"
            [versioned-build]="${{ needs.versioned-build.result }}"
            [docker-release]="${{ needs.docker-release.result }}"
            [sbom]="${{ needs.sbom.result }}"
            [container-scan]="${{ needs.container-scan.result }}"
            [migration-failure-gate]="${{ needs.migration-failure-gate.result }}"
            [published-smoke-test]="${{ needs.published-smoke-test.result }}"
          )

          overall="GO"
          {
            echo "## Release Gate — GO/NO-GO"
            echo ""
            echo "| Job | Result | Status |"
            echo "|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"

          for job in "${!results[@]}"; do
            result="${results[$job]}"
            if [ "$result" = "success" ]; then
              status="✅ PASS"
            else
              status="❌ FAIL"
              overall="NO-GO"
            fi
            echo "| $job | $result | $status |" >> "$GITHUB_STEP_SUMMARY"
          done

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Overall: $overall" >> "$GITHUB_STEP_SUMMARY"

          if [ "$overall" = "NO-GO" ]; then
            echo "::error::Release gate is NO-GO — one or more required jobs did not succeed."
            exit 1
          fi
